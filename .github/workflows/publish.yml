name: Publish to npm

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          # Do NOT set registry-url here — it breaks OIDC trusted publishing
          # when NODE_AUTH_TOKEN is unset.

      - name: Upgrade npm (OIDC needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check if version is already published
        id: version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $PACKAGE_VERSION is already on npm — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version $PACKAGE_VERSION is not on npm — will publish."
          fi

      - name: Publish to npm
        if: steps.version.outputs.exists == 'false'
        run: npm publish --access public
        # Provenance is generated automatically with trusted publishing.
        # No NPM_TOKEN / NODE_AUTH_TOKEN — auth is via OIDC.
